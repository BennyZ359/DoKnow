[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doknow-backend"
version = "0.1.0"
description = "DoKnow: learn, practice, apply, teach, reflect, and recall."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.18,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "langgraph>=0.2,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
