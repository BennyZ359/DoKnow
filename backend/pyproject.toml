[project]
name = "doknow-backend"
version = "0.1.0"
description = "DoKnow - AI Learning OS backend (FastAPI + PostgreSQL/pgvector + LangGraph + Redis)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "redis>=5.0",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Heavy document-parsing backends; kept optional to keep the core image lean.
docling = ["docling>=2.0"]
mineru = ["mineru>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt prose (Chinese) legitimately has long lines; don't wrap it.
"app/agents/prompts.py" = ["E501"]
# FastAPI's canonical dependency idiom uses calls in parameter defaults.
"app/api/**" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
