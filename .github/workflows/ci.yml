name: Validate DoKnow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check app tests
      - run: uv run --frozen ruff check ../scripts
  local-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: uv run --frozen pytest -q tests/test_diagnostics.py tests/test_local_launcher.py
        working-directory: backend
      - name: Real Windows demo lifecycle
        shell: pwsh
        run: |
          try {
            & .\doknow.ps1 start --demo --backend-port 8016 --frontend-port 5186
            if ($LASTEXITCODE -ne 0) { throw 'Start failed' }
            & .\doknow.ps1 start --demo --backend-port 8016 --frontend-port 5186
            if ($LASTEXITCODE -ne 0) { throw 'Duplicate start failed' }
            & .\doknow.ps1 diagnose --demo --backend-port 8016 --frontend-port 5186
            if ($LASTEXITCODE -ne 0) { throw 'Diagnosis failed' }
          } finally {
            & .\doknow.ps1 stop
            if ($LASTEXITCODE -ne 0) { throw 'Stop failed' }
          }
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
        env:
          DOKNOW_BROWSER_CHANNEL: chromium
