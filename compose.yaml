name: doknow
services:
  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: doknow
      POSTGRES_USER: doknow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doknow-local-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/10-doknow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doknow -d doknow"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://doknow:${POSTGRES_PASSWORD:-doknow-local-change-me}@database:5432/doknow
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      CORS_ORIGINS: http://localhost:${DOKNOW_PORT:-8080}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOKNOW_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
